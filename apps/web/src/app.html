<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/favicon-192.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <title>ModularCore Hub</title>
    <meta
      name="description"
      content="Componentes headless multi-proveedor publicados en el registry. Instálalos manualmente o vía CLI, con página de detalle y playground en vivo."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ModularCore Hub" />
    <meta property="og:title" content="ModularCore Hub" />
    <meta
      property="og:description"
      content="Componentes headless multi-proveedor con página de detalle y playground en vivo."
    />
    <meta property="og:url" content="https://modularcorehub.com/" />
    <meta property="og:image" content="https://modularcorehub.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ModularCore Hub" />
    <meta
      name="twitter:description"
      content="Componentes headless multi-proveedor con página de detalle y playground en vivo."
    />
    <meta name="twitter:image" content="https://modularcorehub.com/og-image.png" />
    <script>
      // Apply the saved (or system) theme before first paint so the page never flashes the
      // wrong palette. Kept inline and dependency-free on purpose; the toggle updates the same
      // <html> class and localStorage key at runtime.
      (function () {
        try {
          var stored = localStorage.getItem('mc-theme');
          var dark = stored
            ? stored === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
