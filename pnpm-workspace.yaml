packages:
  - "packages/*"
  - "apps/*"
  # fixtures/* are Phase 2 spike targets (throwaway apps that receive injected copy-code),
  # not publishable/shared packages, so they are kept standalone with their own
  # `pnpm install --ignore-workspace` instead of joining this workspace.
allowBuilds:
  canvas: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@sveltejs/kit@2.70.3'
  - '@angular/core@22.1.4'
  - '@vue/compiler-core@3.5.42'
  - '@vue/compiler-dom@3.5.42'
  - '@vue/compiler-sfc@3.5.42'
  - '@vue/compiler-ssr@3.5.42'
  - '@vue/reactivity@3.5.42'
  - '@vue/runtime-core@3.5.42'
  - '@vue/runtime-dom@3.5.42'
  - '@vue/server-renderer@3.5.42'
  - '@vue/shared@3.5.42'
  - vue@3.5.42
  - '@astrojs/internal-helpers@0.11.0'
  - '@astrojs/markdown-satteri@0.4.0'
  - '@astrojs/starlight@0.41.11'
  - astro@7.2.10
